name: Daily Anti-Adblock Sync
on:
  schedule:
    - cron: '0 0 * * *' # Runs once a day at 00:00 UTC (Uses 30 builds/month)
  workflow_dispatch:     # Allows you to click a button to run it manually

# ⬇️ ADD THIS BLOCK TO FIX THE 403 ERROR ⬇️
permissions:
  contents: write

jobs:
  sync-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Name Assets
        run: |
          # Generate date strings matching UTC timezone
          YESTERDAY=$(date -u -d "yesterday" +"%Y-%m-%d")
          TODAY=$(date -u +"%Y-%m-%d")
          TOMORROW=$(date -u -d "tomorrow" +"%Y-%m-%d")
          
          # Download the source script to cover all global timezones
          curl -sL "https://adbpage.com/adblock?v=3&format=js&lnxv=2" -o "asset-${YESTERDAY}.js"
          curl -sL "https://adbpage.com/adblock?v=3&format=js&lnxv=2" -o "asset-${TODAY}.js"
          curl -sL "https://adbpage.com/adblock?v=3&format=js&lnxv=2" -o "asset-${TOMORROW}.js"

      - name: Commit Back to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add asset-*.js
          git diff-index --quiet HEAD || (git commit -m "Daily rotation sync completed" && git push)
